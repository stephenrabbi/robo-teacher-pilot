name: Classroom 2.0 Welcome Browser QA
on:
  pull_request:
    paths:
      - 'classroom/**'
      - 'tests/test_classroom2_welcome_browser.py'
      - '.github/workflows/classroom2-welcome-browser.yml'
  workflow_dispatch:
jobs:
  chromium-qa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Run welcome browser QA
        run: python -m unittest discover -s tests -p 'test_classroom2_welcome_browser.py' -v
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classroom2-welcome-screenshots
          path: /tmp/classroom2-welcome-*.png
          if-no-files-found: ignore
