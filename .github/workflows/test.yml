name: Robo-Teacher Tests

on:
  push:
    branches: [main, v2-development, v2.5-classroom]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run pilot sanity tests
        run: python test_webhook.py

      - name: Run privacy and accessibility regression checks
        run: python test_compliance.py

      - name: Run V2 adaptive-memory tests
        run: python test_v2_profile.py

      - name: Run V2 multimodal safety tests
        run: python test_v2_multimodal.py

      - name: Run V2 voice safety tests
        run: python test_v2_voice.py

      - name: Run V2 resilience/fallback tests
        run: python test_v2_resilience.py

      - name: Run V2 Telegram webhook authentication tests
        run: python test_v2_webhook_security.py

      - name: Run V2.5 classroom API safety tests
        run: python test_v25_classroom.py

      - name: Collect and run all V2.5 classroom tests
        run: python -m pytest -q test_v25_classroom.py

      - name: Run adaptive understanding reteach tests
        run: python -m pytest -q test_adaptive_understanding.py

      - name: Check mastery, planner, Practice, voice, whiteboard, identity and Autopilot browser scripts syntax
        run: |
          node --check classroom/app.js
          node --check classroom/mastery_memory.js
          node --check classroom/mastery_recheck.js
          node --check classroom/autonomous_planner.js
          node --check classroom/autopilot_session.js
          node --check classroom/practice_reliability.js
          node --check classroom/handsfree_language_continuity.js
          node --check classroom/whiteboard_draft_continuity.js
          node --check classroom/learner_identity_guard.js

      - name: Run mastery recheck integration tests
        run: python -m pytest -q test_mastery_recheck.py

      - name: Run distinct mastery confirmation tests
        run: python -m pytest -q test_distinct_mastery_confirmation.py

      - name: Run persistent mastery memory tests
        run: python -m pytest -q test_persistent_mastery.py

      - name: Run misconception-aware memory tests
        run: python -m pytest -q test_misconception_memory.py

      - name: Run recommended lesson handoff tests
        run: python -m pytest -q test_recommended_lesson_followup.py

      - name: Run autonomous learning planner tests
        run: python -m pytest -q test_autonomous_planner.py

      - name: Run prerequisite-aware learning path tests
        run: python -m pytest -q test_prerequisite_learning_path.py

      - name: Run teacher-support escalation tests
        run: python -m pytest -q test_teacher_support_escalation.py

      - name: Run retention-aware spaced review tests
        run: python -m pytest -q test_retention_spaced_review.py

      - name: Run pilot input and audio regression tests
        run: python -m pytest -q test_pilot_report_regressions.py

      - name: Run Practice reliability recovery tests
        run: python -m pytest -q test_practice_reliability.py

      - name: Run hands-free language continuity tests
        run: python -m pytest -q test_handsfree_language_continuity.py

      - name: Run whiteboard draft continuity tests
        run: python -m pytest -q test_whiteboard_draft_continuity.py

      - name: Run learner identity isolation tests
        run: python -m pytest -q test_learner_identity_guard.py

      - name: Run browser learner continuity regression tests
        run: node --test tests/learner_continuity.test.cjs

      - name: Run isolated browser offline queue tests
        run: node --test tests/browser_queue.test.cjs

      - name: Run isolated per-learner browser queue tests
        run: node --test tests/scoped_browser_queue.test.cjs

      - name: Run synthetic shared-device session switch tests
        run: node --test tests/session_queue_controller.test.cjs

      - name: Run synthetic cross-tab synchronization tests
        run: node --test tests/cross_tab_sync.test.cjs

      - name: Run synthetic browser Web Locks adapter tests
        run: node --test tests/browser_lock_adapter.test.cjs

      - name: Run synthetic progress persistence authorization tests
        run: python -m unittest discover -s tests -p test_progress_store.py -v

      - name: Run concurrent progress write and replay tests
        run: python -m unittest discover -s tests -p test_progress_concurrency.py -v

      - name: Run synthetic offline sync and recovery tests
        run: python -m unittest discover -s tests -p test_offline_sync.py -v

      - name: Run synthetic signed-session authentication tests
        run: python -m unittest discover -s tests -p test_progress_auth.py -v

      - name: Run approved identity and recovery prototype tests
        run: python -m unittest discover -s tests -p test_identity_prototype.py -v

      - name: Run isolated authenticated progress boundary tests
        run: python -m unittest discover -s tests -p test_progress_boundary.py -v

      - name: Run reviewed enrollment gate tests
        run: python -m unittest discover -s tests -p test_enrollment_gateway.py -v

      - name: Run independent approval evidence boundary tests
        run: python -m unittest discover -s tests -p test_approval_evidence.py -v

      - name: Verify signed independent provider assertions
        run: python -m unittest discover -s tests -p test_signed_approval_provider.py -v

      - name: Verify durable approval replay protection
        run: python -m unittest discover -s tests -p test_durable_approvals.py -v

      - name: Verify durable synthetic enrollment and recovery
        run: python -m unittest discover -s tests -p test_durable_identity.py -v

      - name: Verify synthetic proof-of-possession login
        run: python -m unittest discover -s tests -p test_proof_login.py -v

      - name: Verify durable synthetic login throttling
        run: python -m unittest discover -s tests -p test_login_rate_limits.py -v

      - name: Verify recovery revocation after restart and concurrent redemption
        run: python -m unittest discover -s tests -p test_revocation_restart.py -v

      - name: Verify enrolled identity protected synthetic progress API
        run: python -m unittest discover -s tests -p test_durable_identity_api.py -v

      - name: Verify persistent recovery attempt rate limits
        run: python -m unittest discover -s tests -p test_recovery_rate_limits.py -v

      - name: Run complete synthetic learner journey tests
        run: python -m unittest discover -s tests -p test_synthetic_progress_journey.py -v

      - name: Run disabled-by-default synthetic progress API tests
        run: python -m unittest discover -s tests -p test_synthetic_api.py -v

      - name: Run resumable Autopilot session tests
        run: python -m pytest -q test_resumable_autopilot.py

      - name: Run bounded Autopilot session tests
        run: python -m pytest -q test_autopilot_session.py

  browser-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated browser test tooling
        run: npm install --no-save @playwright/test esbuild
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Build isolated browser adapter bundle
        run: npx esbuild progress_store/browser_lock_adapter.cjs --bundle --platform=browser --format=iife --global-name=SyntheticBrowserLocks --outfile=build/synthetic-lock-bundle.js
      - name: Test real Chromium tabs and learner isolation
        run: npx playwright test tests/real_browser_sync.spec.cjs --reporter=line

  runtime-import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Render runtime Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Verify staging app imports promptly on Python 3.14
        run: timeout 30 python -c "import v25_app; print('Python 3.14 staging import OK')"
