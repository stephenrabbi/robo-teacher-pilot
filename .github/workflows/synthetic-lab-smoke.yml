name: Synthetic Learner Lab Validation

on:
  push:
    branches:
      - synthetic-learner-lab-v1
    paths:
      - "evaluation/synthetic_lab/personas.json"
      - "evaluation/synthetic_lab/test_matrix.json"
      - "evaluation/synthetic_lab/run_synthetic_lab.py"
      - ".github/workflows/synthetic-lab-smoke.yml"
  workflow_dispatch:

concurrency:
  group: synthetic-lab-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run 24-scenario isolated validation
        env:
          ROBO_TEACHER_BASE_URL: https://robo-teacher-synthetic-lab.onrender.com
        run: |
          python evaluation/synthetic_lab/run_synthetic_lab.py --live --max-cases 24 --delay 5.5

      - name: Upload validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-lab-validation-results
          path: evaluation/synthetic_lab/results/*
          if-no-files-found: warn
