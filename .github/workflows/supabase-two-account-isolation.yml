name: Supabase Synthetic Two-Account Isolation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  two-account-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: synthetic-supabase-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install httpx==0.28.1
      - name: Verify separately authenticated synthetic accounts
        env:
          ROBO_TEST_SUPABASE_URL: https://gpshctxxgjvzplrbegwf.supabase.co
          ROBO_TEST_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.ROBO_TEST_SUPABASE_PUBLISHABLE_KEY }}
          ROBO_TEST_USER_A_EMAIL: ${{ secrets.ROBO_TEST_USER_A_EMAIL }}
          ROBO_TEST_USER_A_PASSWORD: ${{ secrets.ROBO_TEST_USER_A_PASSWORD }}
          ROBO_TEST_USER_B_EMAIL: ${{ secrets.ROBO_TEST_USER_B_EMAIL }}
          ROBO_TEST_USER_B_PASSWORD: ${{ secrets.ROBO_TEST_USER_B_PASSWORD }}
        run: python tests/supabase_two_account_isolation.py
