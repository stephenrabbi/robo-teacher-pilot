name: Classroom Responsive Browser QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium browser QA dependency
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start static classroom preview
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/robo-responsive-http.log 2>&1 &
          echo $! > /tmp/robo-responsive-http.pid
          for attempt in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8765/classroom/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/robo-responsive-http.log
          exit 1
      - name: Verify classroom at mobile, tablet, and desktop sizes
        run: node tests/responsive_browser_qa.cjs
      - name: Verify interrupted lesson and reload journey
        run: node tests/lesson_journey_browser_qa.cjs
      - name: Verify Chromium Web Audio suspend and resume
        run: node tests/web_audio_engine_qa.cjs
      - name: Verify production PCM stream decoder with synthetic audio
        run: node tests/browser_pcm_stream_qa.cjs
      - name: Save visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classroom-responsive-qa
          path: responsive-qa/
          if-no-files-found: ignore
