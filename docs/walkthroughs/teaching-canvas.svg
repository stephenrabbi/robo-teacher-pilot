<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Robo-Teacher Teaching Canvas illustrated product walkthrough</title>
<desc id="desc">Illustration of step-by-step mathematics teaching on the Robo-Teacher Teaching Canvas.</desc>
<rect width="1200" height="675" fill="#f6f8fb"/>
<rect x="32" y="28" width="1136" height="619" rx="30" fill="#ffffff" stroke="#d6deea" stroke-width="2"/>
<rect x="32" y="28" width="230" height="619" rx="30" fill="#10223d"/>
<rect x="232" y="28" width="30" height="619" fill="#10223d"/>
<text x="72" y="88" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" letter-spacing="2">ROBO-TEACHER</text>
<text x="72" y="116" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#d39a28">AI-POWERED LEARNING FOR EVERYONE</text>
<rect x="58" y="174" width="176" height="54" rx="12" fill="#ffffff"/>
<text x="91" y="209" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#10223d">Chat</text>
<text x="72" y="278" font-family="Arial, sans-serif" font-size="18" fill="#cbd6e5">Today</text>
<text x="72" y="327" font-family="Arial, sans-serif" font-size="18" fill="#cbd6e5">Practice</text>
<text x="72" y="376" font-family="Arial, sans-serif" font-size="18" fill="#cbd6e5">Progress</text>
<text x="72" y="425" font-family="Arial, sans-serif" font-size="18" fill="#cbd6e5">Whiteboard</text>
<text x="72" y="555" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#d39a28">Teach the method,</text>
<text x="72" y="582" font-family="Arial, sans-serif" font-size="18" fill="#ffffff">not just the answer.</text>
<text x="302" y="83" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#3977df" letter-spacing="2">ILLUSTRATED PRODUCT WALKTHROUGH</text>
<text x="302" y="128" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#10223d">Interactive Teaching Canvas</text>
<text x="302" y="158" font-family="Arial, sans-serif" font-size="19" fill="#5f6f86">Worked explanations are presented as a teaching surface, not only a chat reply.</text>
<rect x="302" y="194" width="824" height="64" rx="16" fill="#fff8e8" stroke="#efd79c"/>
<text x="330" y="234" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#10223d">Explain 3/4 + 1/4 step by step</text>
<rect x="302" y="277" width="824" height="78" rx="16" fill="#f7f9fc" stroke="#d6deea"/>
<circle cx="344" cy="316" r="22" fill="#d39a28"/>
<text x="337" y="324" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">1</text>
<text x="386" y="307" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#10223d">Look at the denominators</text>
<text x="386" y="335" font-family="Arial, sans-serif" font-size="17" fill="#5f6f86">Both fractions have denominator 4, so the numerators can be added.</text>
<rect x="302" y="371" width="824" height="78" rx="16" fill="#f7f9fc" stroke="#d6deea"/>
<circle cx="344" cy="410" r="22" fill="#9aa8bb"/>
<text x="337" y="418" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">2</text>
<text x="386" y="401" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#10223d">Add the numerators</text>
<text x="386" y="429" font-family="Arial, sans-serif" font-size="17" fill="#5f6f86">3 + 1 = 4, while the denominator remains 4.</text>
<rect x="302" y="465" width="824" height="78" rx="16" fill="#eef8f4" stroke="#b7dfd0"/>
<circle cx="344" cy="504" r="22" fill="#1f9d6a"/>
<text x="337" y="512" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">3</text>
<text x="386" y="495" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#10223d">Simplify the result</text>
<text x="386" y="523" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1b6d4c">4/4 = 1</text>
<rect x="302" y="568" width="520" height="48" rx="14" fill="#eef4ff"/>
<text x="329" y="599" font-family="Arial, sans-serif" font-size="17" fill="#10223d">Visual teaching support • Read answer • Explain simpler</text>
<rect x="842" y="568" width="284" height="48" rx="14" fill="#d39a28"/>
<text x="911" y="599" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Answer ready</text>
</svg>